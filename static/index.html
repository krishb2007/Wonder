<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · Gemini</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#252525;font:15px/1.7 system-ui,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;height:100dvh}aside{background:#f7f7f5;padding:25px 18px;border-right:1px solid #eeeee9;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:650;letter-spacing:-.8px;margin-bottom:30px}.brand span{color:#65886e}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #91b59b;outline-offset:3px}#new{border:1px solid #deded8;background:white;border-radius:10px;text-align:left;padding:11px 14px;color:#333}.side-note{font-size:12px;color:#888;margin-top:25px;line-height:1.8}.side-bottom{margin-top:auto;color:#899086;font-size:11px}main{display:flex;flex-direction:column;min-width:0;min-height:0}header{height:75px;flex-shrink:0;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;color:#666}.badge{font-size:11px;border:1px solid #e5e8e1;border-radius:20px;padding:4px 10px;color:#758371}#messages{flex:1;overflow:auto;padding:15px max(25px,calc((100% - 780px)/2));scroll-behavior:smooth}.welcome{margin:14vh auto 30px;text-align:center;max-width:650px}.spark{display:inline-grid;place-items:center;width:55px;height:55px;border-radius:18px;background:#eff4ed;color:#65886e;font-size:30px}h1{font-size:32px;line-height:1.3;font-weight:550;letter-spacing:-1px;margin:20px 0 12px}.muted{color:#888;font-size:14px}.suggestions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}.suggestions button{background:white;border:1px solid #e5e7e0;border-radius:12px;padding:12px 15px;color:#666;font-size:13px}.row{margin:12px 0 30px;display:flex;flex-direction:column;align-items:start}.row.user{align-items:end}.bubble{white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#f2f3ef;padding:12px 19px;border-radius:20px;max-width:85%}.model .bubble{width:100%;line-height:1.85}.who{font-size:11px;color:#73816c;margin-bottom:8px;font-weight:600}.composer{width:min(820px,100%);margin:0 auto;padding:15px 25px 18px}form{background:#f4f5f1;border:1px solid #e5e8df;border-radius:23px;padding:13px 15px;display:flex;align-items:end;gap:12px}textarea{resize:none;background:transparent;border:0;outline:0;flex:1;min-width:0;height:55px;max-height:200px;padding:7px;color:#333;line-height:1.6}#send{border:0;background:#314c3b;color:white;border-radius:50%;width:37px;height:37px;flex-shrink:0;font-size:22px}button:disabled{opacity:.45;cursor:wait}#status{font-size:12px;color:#9c5037;min-height:24px;padding:0 8px}.foot{text-align:center;font-size:10px;color:#999;margin-top:9px}@media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}header{padding:15px 20px;height:65px}#mobile-new{display:block!important}h1{font-size:27px}.composer{padding:10px 15px}.welcome{margin-top:9vh}.badge{display:none}}#mobile-new{display:none;background:transparent;border:1px solid #ddd;border-radius:8px;padding:6px 10px}
</style></head><body><div class="app"><aside><div class="brand">chat<span>✳</span></div><button id="new">＋ New chat</button><div class="side-note">A space to ask, explore,<br>and understand.</div><a href="/settings" style="margin-top:24px;color:#52715a;text-decoration:none">⚙ Settings</a><div class="side-bottom">Temporary conversations<br>Memory lasts while this server runs.</div></aside><main><header><a href="/settings" style="color:#52715a;font-size:13px;text-decoration:none">Settings</a><span>Gemini <span style="color:#aaa">/ your assistant</span></span><span class="badge">● Temporary chat</span><button id="mobile-new">＋ New chat</button></header><div id="messages" aria-live="polite"></div><div class="composer"><div id="status" role="status"></div><form id="form"><textarea id="prompt" aria-label="Message Gemini" placeholder="Message Gemini…" rows="2"></textarea><button id="send" aria-label="Send message">↑</button></form><div class="foot">Gemini can make mistakes. Check important information.</div></div></main></div><script>
const $=id=>document.getElementById(id);let busy=false;
function lock(v){busy=v;['send','new','mobile-new'].forEach(id=>$(id).disabled=v);$('prompt').disabled=v;document.querySelectorAll('.suggestions button').forEach(b=>b.disabled=v)}
async function api(path,body){const r=await fetch(path,body!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed.');return data}
function welcome(){$('messages').innerHTML='<div class="welcome"><div class="spark">✳</div><h1>What’s on your mind?</h1><div class="muted">Ask a question, paste something interesting, or explore an idea.</div><div class="suggestions"><button>Explain a difficult concept</button><button>Help me understand a paper</button><button>Brainstorm with me</button></div></div>';document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{$('prompt').value=b.textContent;$('prompt').focus()})}
function add(role,text){const row=document.createElement('div');row.className='row '+role;if(role==='model'){const label=document.createElement('div');label.className='who';label.textContent='✳ GEMINI';row.append(label)}const content=document.createElement('div');content.className='bubble';content.textContent=text;row.append(content);$('messages').append(row);$('messages').scrollTop=$('messages').scrollHeight;return row}
async function reset(){if(busy)return;lock(true);try{await api('/api/reset',{});welcome();$('prompt').value='';$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{lock(false);$('prompt').focus()}}
$('new').onclick=reset;$('mobile-new').onclick=reset;
$('form').onsubmit=async e=>{e.preventDefault();const question=$('prompt').value.trim();if(!question||busy)return;lock(true);if($('messages').querySelector('.welcome'))$('messages').replaceChildren();const pending=add('user',question);$('status').textContent='Gemini is thinking…';try{const data=await api('/api/chat',{message:question});add('model',data.answer);$('prompt').value='';$('status').textContent=''}catch(e){pending.remove();$('status').textContent=e.message}finally{lock(false);$('prompt').focus()}};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
welcome();lock(true);api('/api/history').then(rows=>{if(rows.length){$('messages').replaceChildren();rows.forEach(m=>add(m.role,m.text))}}).catch(e=>$('status').textContent=e.message).finally(()=>lock(false));
</script></body></html>
